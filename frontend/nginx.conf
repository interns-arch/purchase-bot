server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints its assets (app.<hash>.js), so they can be cached
    # hard; index.html must never be cached or users keep the old bundle
    # after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: React Router handles /command-centre, /vendor-inventory,
    # /vendor-performance/12 and friends, so anything that is not a real file
    # is served the app shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API lives on its own origin (VITE_API_BASE_URL) and is called with
    # a bearer token, so nothing is proxied here.
}
