server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints its assets (app.<hash>.js), so they can be cached
    # hard; index.html must never be cached or users keep the old bundle
    # after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: React Router handles /command-centre, /vendor-inventory,
    # /vendor-performance/12 and friends, so anything that is not a real file
    # is served the app shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-port deployment: /api/* and /health are proxied to the backend
    # container over the compose network, so the whole app (UI + API +
    # WhatsApp webhook) is served from this one published port. Builds with
    # VITE_API_BASE_URL=/ use this; builds pointing at a separate API origin
    # simply never hit these locations.
    # Docker's DNS + a variable re-resolves "backend" after it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Inventory uploads are capped at 25 MB by the backend; leave headroom.
    client_max_body_size 32m;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Imports (and the AI column-mapping fallback) can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }
}
