# ProcureHub -- public reverse proxy on the EC2 host.
#
#   Internet -> Nginx :80 -> 127.0.0.1:4009  (frontend container, nginx+static)
#                         -> 127.0.0.1:4008  (backend container, FastAPI)
#
# Install on EC2:
#   sudo cp deploy/nginx/procurehub.conf /etc/nginx/sites-available/procurehub
#   sudo ln -sf /etc/nginx/sites-available/procurehub /etc/nginx/sites-enabled/procurehub
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Both upstreams listen on loopback only (deploy/docker-compose.prod.yml), so
# this file is the ONLY public entrance. Postgres is not published at all.

upstream procurehub_frontend {
    server 127.0.0.1:4009;
}

upstream procurehub_backend {
    server 127.0.0.1:4008;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once you have one; the IP works meanwhile.
    server_name _;

    # Vendor stock files are large. The backend enforces its own limit
    # (MAX_UPLOAD_SIZE_MB, default 25) -- keep this comfortably above it so
    # Nginx returns the backend's clear message instead of a bare 413.
    client_max_body_size 32m;

    # Do not advertise the exact Nginx version.
    server_tokens off;

    access_log /var/log/nginx/procurehub.access.log;
    error_log  /var/log/nginx/procurehub.error.log;

    # ---- API ------------------------------------------------------------
    # The frontend is built with VITE_API_BASE_URL=/ so the browser calls
    # /api/... on this same origin; everything under /api goes to FastAPI.
    location /api/ {
        proxy_pass http://procurehub_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A file import is processed synchronously and a 25,000-row vendor
        # file takes a while; the axios client already waits 60s. Anything
        # shorter here would cut off a legitimate import mid-transaction.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Excel/ZIP downloads (workbooks, allocation reports) must stream
        # straight through rather than being buffered to disk first.
        proxy_buffering off;
    }

    # Health endpoint for uptime pingers, without exposing the whole API.
    location = /health {
        proxy_pass http://procurehub_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Frontend -------------------------------------------------------
    # The frontend container runs its own nginx that already handles the
    # SPA fallback and asset caching; this simply hands off to it.
    location / {
        proxy_pass http://procurehub_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- HTTPS ---------------------------------------------------------------
# Once a domain points at this instance, run:
#     sudo apt install -y certbot python3-certbot-nginx
#     sudo certbot --nginx -d your-domain.example.com
# Certbot edits this file in place (adds the :443 server block and the
# HTTP->HTTPS redirect). No application change is needed: the frontend calls
# the API on the same origin, so it follows to HTTPS automatically.
